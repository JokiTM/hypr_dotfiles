directory: ~/Music
library: ~/.config/beets/musiclibrary.db
import:
    move: yes
clutter: 
  - "*.jpg"
  - "*.png"
  - "*.pdf"
  - "*.lrc"
  - "*.nfo"
  - "*.cue"
  - "*.log"
  - "*.m3u"
  - "*.txt"
plugins: musicbrainz replaygain fetchart lastgenre info missing ftintitle edit convert fromfilename
replaygain:
    threads: 16
    backend: ffmpeg
    auto: yes
    overwrite: yes
fetchart:
    cover_format: JPEG
    deinterlace: yes
ftintitle:
    auto: yes
    drop: yes
    custom_words:
      - "feat"
lyrics:
  auto: yes
  synced: yes
  force: no
lastgenre:
  auto: yes
  canonical: yes
paths:
    default: $album_artist_no_feat/$album%aunique{}/$track $title
    singleton: Non-Album/$artist/$title
    comp: Compilations/$album%aunique{}/$track $title
