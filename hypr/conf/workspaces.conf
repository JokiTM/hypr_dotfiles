workspace = 1, monitor:eDP-1
workspace = 2, monitor:eDP-1
workspace = 3, monitor:eDP-1
workspace = 4, monitor:eDP-1
workspace = 5, monitor:eDP-1
workspace = 6, monitor:HDMI-A-2
workspace = 7, monitor:HDMI-A-2
workspace = 8, monitor:HDMI-A-2
workspace = 9, monitor:HDMI-A-2
workspace = 0, monitor:HDMI-A-2

#Spezialworcspaces funzt nicht
#workspace = special:communication, monitor:DP-3

# ============================
# === Special Workspaces ===
# ============================

bind = Super, S, togglespecialworkspace, scrap
workspace = special:scrap

bind = Super, M, togglespecialworkspace, music
workspace = special:music, on-created-empty:foot -T rmpc zsh -c "~/.config/hypr/scripts/dispatch.sh rmpc"
bind = Super, O, togglespecialworkspace, obs
workspace = special:obs, gapsin:50, gapsout:50, on-created-empty:obs

bind = Super, T, togglespecialworkspace, thunderbird
workspace = special:thunderbird, on-created-empty:thunderbird

#bind = Super, P, togglespecialworkspace, piracy
#workspace = special:piracy, on-created-empty:qbittorrent && nicotine

bind = Super, C, togglespecialworkspace, whatsapp
workspace = special:whatsapp, on-created-empty:librewolf --new-window https://web.whatsapp.com

bind = Ctrl+Shift, Escape, togglespecialworkspace, sysmon
workspace = special:sysmon, on-created-empty:foot zsh -c "~/.config/hypr/scripts/dispatch.sh btop"
#workspace = special:sysmon, on-created-empty:foot fish -C "source ~/.config/fish/functions/fish_greeting.fish && btop && exit"

bind = , XF86NotificationCenter, togglespecialworkspace, calc
workspace = special:calc, on-created-empty:foot -T qalc zsh -c '~/.config/hypr/scripts/dispatch.sh qalc'
